[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papers"
version = "0.1.0"
description = "A citation-graph reference-library TUI built on papis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Craig Miller" }]
keywords = ["papis", "citations", "bibliography", "tui", "textual", "reference-manager"]
dependencies = [
    "papis==0.15.0",
    "textual>=8,<9",
    "httpx",
    "rapidfuzz",
    "citeproc-py",
]

[project.scripts]
papers = "papers.cli:main"
papers-fetch = "papers.cli:fetch_main"

[tool.hatch.build.targets.wheel]
# Non-.py files inside the package (styles/csl/*.csl + ATTRIBUTION.md) are included automatically.
packages = ["papers"]

[tool.hatch.build.targets.sdist]
include = ["papers", "tests", "README.md", "LICENSE"]
